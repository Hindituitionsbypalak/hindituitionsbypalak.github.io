<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hindi Tuitions by Palak</title>
<meta name="description" content="Hindi tuition for Nursery to Class 12, all boards — by Palak Pareek, M.A. Hindi Literature Gold Medalist, B.Ed., Banasthali Vidyapith. Enquire on WhatsApp.">
<meta property="og:title" content="Hindi Tuitions by Palak · हिंदी ट्यूशन">
<meta property="og:image" content="https://hindituitionsbypalak.github.io/palak.jpg">
<meta property="og:url" content="https://hindituitionsbypalak.github.io/">
<meta property="og:description" content="Nursery to Class 12 · All boards · Gold Medalist teacher. Enquire on WhatsApp: 63761 62488">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230b0709%27/%3E%3Ctext x=%2732%27 y=%2746%27 font-size=%2740%27 text-anchor=%27middle%27 fill=%27%23ff2e88%27 font-family=%27serif%27%3E%E0%A4%AA%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0b0709">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,500&family=Kalam:wght@400;700&family=Mukta:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi&family=Rozha+One&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b0709; --night-2:#160d12;
  --rani:#ff2e88; --peacock:#3a7bff; --leaf:#3ddc84; --marigold:#ffb627;
  --paper:#f7f0e3; --paper-2:#efe4cf; --ink:#1e1216; --muted:#6b5a55; --wine:#5b0e25;
  --serif:'Fraunces','Tiro Devanagari Hindi',serif;
  --deva:'Rozha One','Tiro Devanagari Hindi',serif;
  --hand:'Kalam',cursive;
  --sans:'Mukta',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--night);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
html[lang=hi] body{font-size:18px}
a{color:inherit}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

#sky{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block}
main{position:relative;z-index:1;overflow-x:clip}
.wrap{width:min(1180px,100% - 40px);margin:0 auto}

/* ---------- NAV ---------- */
nav{position:fixed;top:0;left:0;right:0;z-index:50;transition:background .3s,backdrop-filter .3s}
nav.solid{background:rgba(11,7,9,.72);backdrop-filter:blur(10px)}
nav .wrap{display:flex;align-items:center;gap:18px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.logo b{font-family:'Tiro Devanagari Hindi',serif;font-size:28px;font-weight:400;color:var(--rani);line-height:1}
.logo span{font-family:var(--serif);font-size:17px;line-height:1.05}
.logo small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#cdbfc3}
.links{display:flex;gap:22px;margin-left:auto}
.links a{color:#e9dde0;text-decoration:none;font-size:15px;opacity:.85}
.links a:hover{opacity:1;color:var(--marigold)}
.lang{display:flex;border:1.5px solid rgba(255,255,255,.35);border-radius:40px;overflow:hidden;margin-left:8px}
.lang button{padding:5px 12px;font-size:14px;color:#fff;font-weight:600}
.lang button.on{background:#fff;color:var(--night)}
.navwa{background:var(--leaf);color:#062b16;font-weight:700;padding:8px 16px;border-radius:40px;text-decoration:none;font-size:15px;white-space:nowrap}
@media(max-width:860px){.links{display:none}.lang{margin-left:auto}.navwa{display:none}}

/* ---------- HERO (window to the sky) ---------- */
.hero{min-height:100svh;display:flex;align-items:center;position:relative;color:#fff;padding:100px 0 70px}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,7,9,.88) 0%,rgba(11,7,9,.55) 45%,transparent 75%);pointer-events:none}
.hero .wrap{position:relative;pointer-events:none}
.hero .wrap > *{pointer-events:auto}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:14px;letter-spacing:2.5px;text-transform:uppercase;color:var(--marigold);font-weight:700}
html[lang=hi] .kicker{letter-spacing:.5px;font-size:16px}
.kicker::before{content:"";width:28px;height:2px;background:var(--marigold)}
.hero h1{font-family:var(--serif);font-weight:800;font-size:clamp(46px,7.6vw,104px);line-height:.98;letter-spacing:-1.5px;margin:18px 0 22px;max-width:11.5ch}
html[lang=hi] .hero h1{font-family:var(--deva);font-weight:400;letter-spacing:0;line-height:1.15;max-width:12ch}
.hero h1 em{font-style:italic;color:var(--rani);font-family:var(--hand);font-weight:700;display:inline-block;transform:rotate(-3deg);filter:url(#boil)}
.hero p.lead{font-size:clamp(17px,1.6vw,20px);max-width:540px;color:#e6d9dc}
.hero p.lead b{color:#fff}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border-radius:50px;font-weight:700;text-decoration:none;font-size:17px;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:22px;height:22px;flex:none}
.btn.wa{background:var(--leaf);color:#062b16;box-shadow:0 8px 30px rgba(61,220,132,.35)}
.btn.call{border:2px solid rgba(255,255,255,.6);color:#fff}
.btn.call:hover{background:#fff;color:var(--night)}
.hint{margin-top:34px;font-family:var(--hand);font-size:20px;color:var(--rani);display:flex;align-items:center;gap:10px}
.hint i{display:inline-block;animation:bob 1.6s ease-in-out infinite;font-style:normal}
@keyframes bob{50%{transform:translateY(-5px) rotate(10deg)}}
.scrolldown{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);color:#bba9ae;font-size:12px;letter-spacing:3px;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:6px}
.scrolldown::after{content:"";width:2px;height:34px;background:linear-gradient(var(--rani),transparent);animation:drip 1.8s infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* Letter card popup */
#lcard{position:fixed;z-index:60;left:50%;bottom:28px;transform:translate(-50%,140%);transition:transform .45s cubic-bezier(.2,1.4,.4,1);background:#fff;color:var(--ink);border-radius:22px;padding:16px 22px 16px 16px;display:flex;align-items:center;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
#lcard.show{transform:translate(-50%,0)}
#lcard .big{font-family:'Tiro Devanagari Hindi',serif;font-size:64px;line-height:1;width:84px;height:84px;display:grid;place-items:center;background:var(--night);color:var(--rani);border-radius:16px;flex:none}
#lcard .t{font-size:15px;color:var(--muted)}
#lcard .w{font-family:var(--deva);font-size:28px;line-height:1.2;color:var(--wine)}
#lcard .w span{font-size:30px}
#lcard .say{margin-left:6px;width:44px;height:44px;border-radius:50%;background:var(--rani);color:#fff;display:grid;place-items:center;flex:none}
#lcard .x{position:absolute;top:6px;right:10px;font-size:18px;color:#aaa}

/* ---------- CREDENTIAL STRIP ---------- */
.creds{background:var(--paper);position:relative}
.creds .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.cred{padding:30px 22px;border-right:1.5px dashed #d9c9ad}
.cred:last-child{border-right:none}
.cred .n{font-family:var(--serif);font-weight:800;font-size:30px;color:var(--wine);line-height:1.1}
html[lang=hi] .cred .n{font-family:var(--deva);font-weight:400}
.cred .n i{font-style:normal;color:var(--rani)}
.cred p{font-size:15px;color:var(--muted);margin-top:4px}
@media(max-width:860px){.creds .wrap{grid-template-columns:1fr 1fr}.cred:nth-child(2){border-right:none}.cred{border-bottom:1.5px dashed #d9c9ad}}
.edge{position:absolute;left:0;right:0;width:100%;height:26px;pointer-events:none}
.edge.top{top:-25px}
.edge.bot{bottom:-25px;transform:scaleY(-1)}
.edge path{fill:var(--paper)}

/* ---------- MARQUEE ---------- */
.marq{background:var(--rani);color:#fff;overflow:hidden;white-space:nowrap;padding:14px 0;transform:rotate(-1.2deg);margin:26px -20px 0;position:relative;z-index:2;box-shadow:0 10px 30px rgba(255,46,136,.25)}
.marq div{display:inline-block;animation:marq 38s linear infinite;font-family:'Tiro Devanagari Hindi',serif;font-size:26px}
.marq span{margin:0 22px}
.marq span.e{font-family:var(--hand);font-weight:700;font-size:24px}
@keyframes marq{to{transform:translateX(-50%)}}

/* ---------- PAPER SECTIONS ---------- */
.paper{background:var(--paper);padding:110px 0;position:relative}
.paper.alt{background:var(--paper-2)}
.eyebrow{font-family:var(--hand);font-size:22px;color:var(--rani);display:flex;align-items:center;gap:10px}
.eyebrow b{font-family:var(--sans);font-size:13px;font-weight:800;color:var(--wine);background:#fff;border:1.5px solid var(--wine);border-radius:30px;padding:1px 10px}
h2{font-family:var(--serif);font-weight:800;font-size:clamp(36px,5vw,62px);line-height:1.02;letter-spacing:-1px;color:var(--ink);margin:12px 0 18px;max-width:16ch}
html[lang=hi] h2{font-family:var(--deva);font-weight:400;letter-spacing:0;line-height:1.2}
h2 em{font-style:italic;color:var(--wine)}
.intro{font-size:19px;color:var(--muted);max-width:620px}
.reveal{opacity:0;transform:translateY(34px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}

/* About */
.about{display:grid;grid-template-columns:420px 1fr;gap:70px;align-items:center}
@media(max-width:900px){.about{grid-template-columns:1fr;gap:40px}}
.portrait{position:relative;width:min(380px,100%);aspect-ratio:1;margin:0 auto}
.portrait .ph{position:absolute;inset:26px;border-radius:50%;overflow:hidden;background:#ff9cc6}
.portrait .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.portrait svg.ring{position:absolute;inset:0;width:100%;height:100%;filter:url(#boil);overflow:visible}
.portrait .medal{position:absolute;right:-4px;bottom:24px;width:118px;height:118px;border-radius:50%;background:conic-gradient(#8f621c,#f6dc9c,#b9842f,#fbe7b0,#9a6b1f,#f1d18a,#8f621c);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:rotate(8deg)}
.portrait .medal div{width:98px;height:98px;border-radius:50%;background:var(--wine);color:#f6dc9c;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.05;border:2px solid #f6dc9c}
.portrait .medal b{font-family:var(--serif);font-size:22px}
.portrait .medal small{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#fff}
.portrait .note{position:absolute;left:-10px;top:8px;font-family:var(--hand);color:var(--wine);font-size:20px;transform:rotate(-8deg);background:#fff8;padding:2px 8px;border-radius:8px}
.about p{font-size:18.5px;color:#3d2c2c;margin-bottom:16px;max-width:600px}
.degrees{list-style:none;margin-top:26px;border-top:1.5px solid #d9c9ad}
.degrees li{display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:16px;padding:14px 0;border-bottom:1.5px solid #d9c9ad}
.degrees .d{font-family:var(--serif);font-weight:800;font-size:24px;color:var(--wine)}
.degrees .tag{font-size:13px;font-weight:700;padding:3px 12px;border-radius:30px;background:#fff;border:1.5px solid #d9c9ad;color:var(--muted);white-space:nowrap}
.degrees .tag.gold{background:linear-gradient(180deg,#fbe7b0,#d9a84e);border-color:#b9842f;color:#4a2c00}
.uni{margin-top:14px;font-size:15px;color:var(--muted)}
.uni b{color:var(--wine)}

/* Journey */
.journey{position:relative;margin-top:60px}
.journey svg.path{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.journey svg.path path{fill:none;stroke:var(--rani);stroke-width:3;stroke-linecap:round}
.journey svg.path path.ghost{stroke:#d9c9ad;stroke-dasharray:2 10}
.stop{position:relative;width:46%;margin-bottom:70px;background:#fff;border-radius:24px;padding:30px 30px 26px;box-shadow:0 18px 50px rgba(91,14,37,.08)}
.stop:nth-child(even){margin-left:auto}
.stop:last-of-type{margin-bottom:0}
.stop .dot{position:absolute;top:34px;width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:0 0 0 6px var(--paper),0 0 0 8px var(--c)}
.stop:nth-child(odd) .dot{right:calc(-8.7% - 11px)}
.stop:nth-child(even) .dot{left:calc(-8.7% - 11px)}
.stop .lvl{font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--c)}
.stop h3{font-family:var(--serif);font-weight:800;font-size:34px;line-height:1.1;margin:4px 0 10px}
html[lang=hi] .stop h3{font-family:var(--deva);font-weight:400}
.stop p{color:#4a3a38}
.stop ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.stop li{font-size:14px;font-weight:600;padding:4px 12px;border-radius:30px;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.stop .doodle{position:absolute;right:20px;top:18px;font-family:var(--deva);font-size:54px;color:var(--c);opacity:.18;filter:url(#boil)}
@media(max-width:860px){.stop,.stop:nth-child(even){width:auto;margin-left:34px}.stop .dot,.stop:nth-child(odd) .dot,.stop:nth-child(even) .dot{left:-45px;right:auto}}
.boards{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:56px;justify-content:center}
.boards span{font-weight:700;padding:8px 18px;border-radius:40px;border:2px solid var(--ink);background:#fff}
.boards em{font-family:var(--hand);font-style:normal;font-size:22px;color:var(--rani);margin-right:6px}

/* Approach */
.ways{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:50px}
@media(max-width:980px){.ways{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.ways{grid-template-columns:1fr}}
.way{background:#fff;border-radius:22px;padding:26px 22px;position:relative;overflow:hidden;transition:transform .3s}
.way:hover{transform:translateY(-6px) rotate(-.6deg)}
.way .gl{font-family:var(--deva);font-size:62px;line-height:1;color:var(--c);filter:url(#boil);height:70px}
.way h3{font-family:var(--serif);font-weight:800;font-size:23px;line-height:1.15;margin:14px 0 8px}
html[lang=hi] .way h3{font-family:var(--deva);font-weight:400;font-size:25px}
.way p{font-size:16px;color:var(--muted)}
.way::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:var(--c);opacity:.08}

/* Quote window (sky shows through) */
.window{position:relative;padding:150px 0;color:#fff;text-align:center}
.window::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(11,7,9,.75),rgba(11,7,9,.35) 70%);pointer-events:none}
.window .wrap{position:relative;pointer-events:none}
.window blockquote{font-family:var(--deva);font-size:clamp(40px,6vw,84px);line-height:1.15}
.window blockquote em{font-style:normal;color:var(--marigold)}
.window p{max-width:760px;margin:22px auto 0;font-size:clamp(18px,1.8vw,22px);color:#efe2e5;font-family:var(--serif);font-style:italic}
html[lang=hi] .window p{font-family:'Tiro Devanagari Hindi',serif;font-style:normal}

/* Varnamala */
.tabs{display:inline-flex;background:#fff;border-radius:40px;padding:5px;margin-top:34px;border:1.5px solid #d9c9ad}
.tabs button{padding:8px 22px;border-radius:40px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;margin-top:26px}
.tile{aspect-ratio:1;perspective:600px}
.tile .in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.4,.4,1);transform-style:preserve-3d}
.tile.flip .in{transform:rotateY(180deg)}
.tile .f,.tile .b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tile .f{background:#fff;font-family:'Tiro Devanagari Hindi',serif;font-size:46px;color:var(--ink);box-shadow:0 4px 0 #d9c9ad;transition:background .2s}
.tile:hover .f{background:#fff3f8;color:var(--rani)}
.tile .b{background:var(--ink);color:#fff;transform:rotateY(180deg);text-align:center;padding:6px}
.tile .b .e{font-size:30px;line-height:1.1}
.tile .b .h{font-family:var(--deva);font-size:19px;color:var(--marigold);line-height:1.2}
.tile .b .m{font-size:11.5px;color:#cbb9bd}

/* FAQ */
.faq{max-width:820px;margin-top:40px}
.faq details{border-bottom:1.5px solid #d9c9ad;padding:20px 0}
.faq summary{list-style:none;cursor:pointer;font-family:var(--serif);font-weight:600;font-size:22px;display:flex;justify-content:space-between;gap:20px}
html[lang=hi] .faq summary{font-family:var(--sans);font-weight:700}
.faq summary::after{content:"+";font-family:var(--hand);font-size:30px;line-height:.8;color:var(--rani);transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin-top:10px;color:var(--muted);font-size:17.5px}

/* Contact window */
.contact{position:relative;padding:130px 0 90px;color:#fff}
.contact::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,7,9,.55),rgba(11,7,9,.92));pointer-events:none}
.contact .wrap{position:relative;display:grid;grid-template-columns:1fr 460px;gap:60px;align-items:center}
@media(max-width:940px){.contact .wrap{grid-template-columns:1fr}}
.contact h2{color:#fff}
.contact h2 em{color:var(--rani)}
.contact .intro{color:#d8c8cc}
.bigphone{display:inline-block;margin-top:26px;font-family:var(--serif);font-weight:800;font-size:clamp(40px,5vw,64px);color:var(--marigold);text-decoration:none;letter-spacing:-1px}
form{background:#fff;color:var(--ink);border-radius:26px;padding:30px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
form h3{font-family:var(--serif);font-size:26px;font-weight:800;line-height:1.1}
html[lang=hi] form h3{font-family:var(--deva);font-weight:400}
form .sub{font-size:14px;color:var(--muted);margin:4px 0 18px}
label{display:block;font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid #ddd0bd;background:#fbf8f2;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rani);border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form .btn{width:100%;justify-content:center;margin-top:20px}
footer{position:relative;background:var(--night);color:#a89599;padding:34px 0;font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
footer b{font-family:var(--deva);font-weight:400;color:var(--rani);font-size:20px}

/* floating WA */
.fwa{position:fixed;right:18px;bottom:18px;z-index:55;width:60px;height:60px;border-radius:50%;background:var(--leaf);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .2s}
.fwa:hover{transform:scale(1.08)}
.fwa svg{width:32px;height:32px;fill:#062b16}
.fwa::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--leaf);animation:ping 2s infinite}
@keyframes ping{to{transform:scale(1.6);opacity:0}}

/* ink cursor */
#ink{position:fixed;left:-100px;top:-100px;width:14px;height:14px;border-radius:50%;background:var(--rani);pointer-events:none;z-index:100;mix-blend-mode:difference;transform:translate(-50%,-50%);transition:width .2s,height .2s;display:none}
@media(hover:hover){#ink{display:block}}
#ink.big{width:46px;height:46px}

@media(prefers-reduced-motion:reduce){.marq div,.hint i,.scrolldown::after,.fwa::before{animation:none}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>

<!-- hand-drawn "boil" filter -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="boil"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
</svg>

<canvas id="sky" aria-hidden="true"></canvas>
<div id="ink"></div>

/* ================= REVEAL + NAV ================= */

/* Journey path (draws with scroll) */
const journey=document.getElementById('journey'), jl=document.getElementById('jline'), jg=document.getElementById('jghost'), jsvg=document.getElementById('jpath');
let jLen=0;
function drawJourney(){
  const W=journey.clientWidth, H=journey.clientHeight; if(!W) return;
  jsvg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const mobile = W<860-40;
  const dots=[...journey.querySelectorAll('.dot')].map(d=>{ const r=d.getBoundingClientRect(), jr=journey.getBoundingClientRect(); return [r.left-jr.left+r.width/2, r.top-jr.top+r.height/2]; });
  let d=`M ${dots[0][0]} ${dots[0][1]}`;
  let prev=dots[0];
  dots.slice(1).forEach((p,i)=>{
    const mid=(prev[1]+p[1])/2, sway = mobile?0:(i%2?-70:70);
    d+=` C ${prev[0]+sway} ${mid}, ${p[0]-sway} ${mid}, ${p[0]} ${p[1]}`; prev=p;

applyLang(LANG);

/* ================= THREE.JS SKY ================= */
(function(){
  if(!window.THREE) return;
  const canvas=document.getElementById('sky');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let renderer; try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false}); }catch(e){ return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setClearColor(0x0b0709,1);
  const scene=new THREE.Scene(); const cam=new THREE.PerspectiveCamera(50,1,.1,100); cam.position.z=10;
  let viewW=10, viewH=10;
  function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); viewH=2*10*Math.tan(25*Math.PI/180); viewW=viewH*cam.aspect; }
  resize(); addEventListener('resize',resize);

  /* --- strokes: rain + ground scribbles, one instanced shader --- */
  function strokes(n, make){
    const g=new THREE.InstancedBufferGeometry(); const base=new THREE.PlaneGeometry(1,1);
    g.index=base.index; g.setAttribute('position',base.getAttribute('position')); g.setAttribute('uv',base.getAttribute('uv'));
    const off=new Float32Array(n*3), sp=new Float32Array(n), len=new Float32Array(n), wid=new Float32Array(n), ang=new Float32Array(n), col=new Float32Array(n*3), sd=new Float32Array(n);
    for(let i=0;i<n;i++){ const s=make(i); off.set(s.o,i*3); sp[i]=s.s; len[i]=s.l; wid[i]=s.w; ang[i]=s.a; col.set(s.c,i*3); sd[i]=Math.random(); }
    const A=(a,k)=>new THREE.InstancedBufferAttribute(a,k);
    g.setAttribute('aOff',A(off,3)); g.setAttribute('aSpeed',A(sp,1)); g.setAttribute('aLen',A(len,1)); g.setAttribute('aWid',A(wid,1)); g.setAttribute('aAng',A(ang,1)); g.setAttribute('aCol',A(col,3)); g.setAttribute('aSeed',A(sd,1));
    g.instanceCount=n; return g;
  }
  const uniforms={uTime:{value:0},uBoil:{value:0},uMouse:{value:new THREE.Vector2(99,99)},uWind:{value:0},uH:{value:22},uScroll:{value:0}};
  const mat=new THREE.ShaderMaterial({uniforms,transparent:true,depthWrite:false,
    vertexShader:`
      attribute vec3 aOff; attribute float aSpeed,aLen,aWid,aAng,aSeed; attribute vec3 aCol;
      uniform float uTime,uBoil,uWind,uH,uScroll; uniform vec2 uMouse;
      varying vec3 vCol; varying vec2 vUv; varying float vA;
      float h(float n){return fract(sin(n)*43758.5453);}
      void main(){
        vec3 c=aOff; float a=aAng;
        float b=floor(uBoil);
        if(aSpeed>0.){ c.y=mod(aOff.y-uTime*aSpeed+uScroll*aSpeed*.6,uH)-uH*.5; a+=uWind; c.x+=c.y*.25*-uWind; }
        else { c.y+=uScroll*.0; }
        a+=(h(aSeed*91.+b)-.5)*.12; c.xy+=(vec2(h(aSeed*13.+b),h(aSeed*7.+b))-.5)*.03;
        vec2 d=c.xy-uMouse; float f=exp(-dot(d,d)/1.6);
        c.xy+=normalize(d+.0001)*f*.9; a+=f*sign(d.x)*.9;
        vec2 p=vec2(position.x*aWid,position.y*aLen);
        float cs=cos(a),sn=sin(a); p=vec2(p.x*cs-p.y*sn,p.x*sn+p.y*cs);
        vec4 mv=modelViewMatrix*vec4(c+vec3(p,0.),1.);
        gl_Position=projectionMatrix*mv; vCol=aCol; vUv=uv; vA=.55+.45*smoothstep(-6.,2.,aOff.z);
      }`,
    fragmentShader:`
      varying vec3 vCol; varying vec2 vUv; varying float vA;
      void main(){ float t=smoothstep(0.,.18,vUv.y)*smoothstep(1.,.75,vUv.y); float e=1.-smoothstep(.35,.5,abs(vUv.x-.5));
        gl_FragColor=vec4(vCol,t*e*vA*.9); }`
  });
  const R=new THREE.Color('#ff2e88'), B=new THREE.Color('#3a7bff'), G=new THREE.Color('#3ddc84'), M=new THREE.Color('#ffb627');
  const N = innerWidth<700 ? 900 : 1900;
  const rain=new THREE.Mesh(strokes(N,()=>{ const r=Math.random(); const c=r<.82?R:(r<.95?B:M);
    return {o:[(Math.random()-.5)*34,Math.random()*22,(Math.random()*9)-6],s:1.2+Math.random()*1.6,l:.18+Math.random()*.35,w:.025+Math.random()*.02,a:.55+Math.random()*.15,c:[c.r,c.g,c.b]}; }),mat);
  rain.frustumCulled=false; scene.add(rain);
  const ground=new THREE.Mesh(strokes(innerWidth<700?500:1100,()=>{ const r=Math.random(); const c=r<.6?R:(r<.92?B:G);
    const y=-3.1-Math.pow(Math.random(),.7)*3.2;
    return {o:[(Math.random()-.5)*30,y,(Math.random()*3)-1.5],s:0,l:.15+Math.random()*.9,w:.02+Math.random()*.03,a:Math.PI/2+(Math.random()-.5)*.35,c:[c.r,c.g,c.b]}; }),mat);
  ground.frustumCulled=false; scene.add(ground);

  /* --- sketchy letter sprites --- */
  const sprites=[]; const letterSet=['अ','आ','इ','क','ख','ग','प','म','ह','त','ज','ओ','ई','र'];
  const palette=['#ff2e88','#ffffff','#3ddc84','#ffb627','#7fb0ff'];
  function sketchTex(draw, seed){
    const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');
    let s=seed; const rnd=()=>{ s=(s*9301+49297)%233280; return s/233280; };
    draw(x,rnd); const t=new THREE.CanvasTexture(c); t.minFilter=THREE.LinearFilter; return t;
  }
  function letterDraw(ch,col){ return (x,rnd)=>{
    x.font='700 168px Kalam, "Tiro Devanagari Hindi", sans-serif'; x.textAlign='center'; x.textBaseline='middle';
    x.globalAlpha=.12; x.fillStyle=col; x.fillText(ch,128,140);
    x.globalAlpha=.95; x.strokeStyle=col; x.lineJoin='round';
    for(let i=0;i<3;i++){ x.lineWidth=2+rnd()*2.5; x.strokeText(ch,128+(rnd()-.5)*7,140+(rnd()-.5)*7); }
    x.globalAlpha=.6; x.lineWidth=1.5; for(let i=0;i<10;i++){ const yy=95+rnd()*95; x.beginPath(); x.moveTo(70+rnd()*40,yy); x.lineTo(150+rnd()*40,yy-12-rnd()*10); x.stroke(); }
  };}
  function moonDraw(x,rnd){
    x.strokeStyle='#3ddc84'; x.lineCap='round';
    for(let i=0;i<5;i++){ x.lineWidth=3+rnd()*4; x.beginPath(); x.arc(128+(rnd()-.5)*5,128+(rnd()-.5)*5,78,Math.PI*.15,Math.PI*1.25); x.stroke(); }
    x.strokeStyle='#ff2e88'; x.lineWidth=2.5; x.beginPath(); x.arc(150,108,62,Math.PI*.2,Math.PI*1.1); x.stroke();
  }
  function make(drawFn,size,data){
    const texs=[0,1,2].map(k=>sketchTex(drawFn,data.seed*7+k*131+1));
    const m=new THREE.SpriteMaterial({map:texs[0],transparent:true,depthWrite:false});
    const sp=new THREE.Sprite(m); sp.scale.set(size,size,1); sp.userData={...data,texs,size};
    scene.add(sp); sprites.push(sp); return sp;
  }
  function buildLetters(){
    letterSet.forEach((ch,i)=>{
      const col=palette[i%palette.length]; const z=-2.5+Math.random()*3.5;
      const wide = innerWidth>860;
      const x = wide ? (-.02 + (i/letterSet.length)*.48)*viewW + (Math.random()-.5)*.8 : (i/letterSet.length-.5)*viewW*.9;
      const y = wide ? -1.8+Math.random()*5 : (Math.random()<.5 ? 2.2+Math.random()*1.6 : -3.4+Math.random()*1.2);
      make(letterDraw(ch,col), (wide?1.1:.8)+Math.random()*.8, {ch, seed:i+3, base:new THREE.Vector3(x, y, z), ph:Math.random()*6.28});
    });
    const moon=make(moonDraw,2.1,{ch:'moon',seed:99,base:new THREE.Vector3(viewW*.36,3.4,-3),ph:0});
  }
  (document.fonts && document.fonts.load ? Promise.all([document.fonts.load('700 168px Kalam','अ'),document.fonts.load('40px "Tiro Devanagari Hindi"','अ')]).catch(()=>{}) : Promise.resolve()).then(buildLetters);

  /* --- interaction --- */
  const mouse=new THREE.Vector2(), ndc=new THREE.Vector2(9,9); let hovered=null; let wind=0;
  const ray=new THREE.Raycaster();
  addEventListener('pointermove',e=>{
    ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
    wind = (ndc.x)*.25;
  });
  function pick(){
    ray.setFromCamera(ndc,cam); const hit=ray.intersectObjects(sprites)[0]; return hit?hit.object:null;
  }
  function skyTarget(t){ return t.closest && t.closest('.sky') && !t.closest('a,button,input,select,textarea,form,label,blockquote,h1,p'); }
  addEventListener('click',e=>{
    if(!skyTarget(e.target)) return;
    ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
    const s=scrollY<innerHeight*.6?pick():null; if(s){ s.userData.pop=1; showLetter(s.userData.ch); }
  });

  /* pause when no sky visible */
  let visible=true; const skies=[...document.querySelectorAll('.sky')]; const vis=new Set();
  const so=new IntersectionObserver(es=>{ es.forEach(e=>e.isIntersecting?vis.add(e.target):vis.delete(e.target)); visible=vis.size>0; if(visible) loop(); },{threshold:0});
  skies.forEach(s=>so.observe(s));

  const clock=new THREE.Clock(); let running=false, t=0;
  function loop(){ if(running) return; running=true; requestAnimationFrame(frame); }
  function frame(){
    if(!visible){ running=false; return; }
    const dt=Math.min(clock.getDelta(),.05); t+=dt*(reduce?.25:1);
    uniforms.uTime.value=t; uniforms.uBoil.value=t*7;
    uniforms.uWind.value+= (wind-uniforms.uWind.value)*.03;
    uniforms.uMouse.value.set(ndc.x*viewW/2, ndc.y*viewH/2);
    uniforms.uScroll.value = scrollY/innerHeight;
    cam.position.y = -Math.min(scrollY/innerHeight,1)*.6;
    const bf=Math.floor(t*7); const lo=Math.max(0,1-scrollY/(innerHeight*.8));
    sprites.forEach((s,i)=>{
      const u=s.userData; s.material.map=u.texs[(bf+i)%3]; s.material.opacity=lo; s.visible=lo>0.01;
      s.position.set(u.base.x+Math.sin(t*.4+u.ph)*.35, u.base.y+Math.sin(t*.7+u.ph)*.25, u.base.z);
      s.material.rotation=Math.sin(t*.5+u.ph)*.12;
      u.pop=(u.pop||0)*.92; const k=u.size*(1+u.pop*.5+(s===hovered?.15:0)); s.scale.set(k,k,1);
    });
    // hover only when pointer over sky area
    const el=document.elementFromPoint((ndc.x+1)/2*innerWidth,(1-ndc.y)/2*innerHeight);
    const h = el && skyTarget(el) ? pick() : null;
    if(h!==hovered){ hovered=h; document.body.style.cursor=h?'pointer':''; ink.classList.toggle('big',!!h); }
    renderer.render(scene,cam);
    requestAnimationFrame(frame);
  }
  loop();
})();
</script>
</body>
</html>
